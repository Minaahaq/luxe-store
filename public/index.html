<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LUXE">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="description" content="LUXE Store — منتجات مختارة بعناية من علامات تجارية عالمية.">
  <title>LUXE Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="main-header" id="mainHeader">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <div class="brand-name">LUXE</div>
    </a>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="ابحث..." autocomplete="off">
    </div>

    <div class="header-actions">
      <button class="icon-btn mobile-search-btn" id="mobileSearchBtn" type="button" aria-label="بحث">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>

      <button class="icon-btn install-app-btn" id="installBtn" type="button" aria-label="تثبيت التطبيق" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>

      <a href="tracking.html" class="icon-btn" title="تتبع الطلب" aria-label="تتبع الطلب">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </a>

      <a href="cart.html" class="icon-btn" title="السلة" aria-label="السلة">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span class="badge" data-cart-badge>0</span>
      </a>

      <div id="userArea"></div>
      <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="القائمة" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <div class="hero-label">مجموعة 2025</div>
      <h1>قطع مختارة<br><span>بعناية</span></h1>
      <p>منتجات من علامات تجارية عالمية، بجودة تستحق الاقتناء.</p>
      <a href="#productsSection" class="btn-hero">تسوق الآن</a>
    </div>
  </div>
</section>

<!-- PRODUCTS -->
<section class="section" id="productsSection">
  <div class="container">
    <div class="section-head">
      <div>
        <div class="section-eyebrow">المجموعة</div>
        <h2>منتجات <span>مختارة</span></h2>
      </div>
    </div>

    <div class="filters-wrap" id="filtersWrap"></div>

    <div class="products-grid" id="productsGrid">
      <!-- سيتم ملؤها بالجافاسكريبت -->
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="footer-brand-name">LUXE</div>
        <p>منتجات مختارة من علامات تجارية عالمية.</p>
      </div>
      <div class="footer-col">
        <h4>تسوق</h4>
        <a href="#" onclick="filterByCategory('الكل');return false">كل المنتجات</a>
      </div>
      <div class="footer-col">
        <h4>خدمة العملاء</h4>
        <a href="tracking.html">تتبع الشحنة</a>
      </div>
    </div>
    <div class="footer-bottom">© 2025 LUXE Store</div>
  </div>
</footer>

<script type="module">
import { api, getCurrentUser, logout } from './js/api.js';
import { showToast, addToCart, updateCartBadge } from './js/ui.js';

let allProducts = [];
let currentCategory = 'الكل';
let searchQuery = '';

async function renderUserArea() {
  const userArea = document.getElementById('userArea');
  const user = await getCurrentUser();
  if (user) {
    const displayName = user.displayName || user.email?.split('@')[0] || 'User';
    const initial = displayName.charAt(0).toUpperCase();
    userArea.innerHTML = `<button class="user-chip" id="userChip"><span>${displayName}</span><div class="user-avatar">${initial}</div></button>`;
    document.getElementById('userChip').addEventListener('click', () => {
      if (confirm('هل تريد تسجيل الخروج؟')) logout().then(() => { showToast('تم تسجيل الخروج', 'info'); setTimeout(() => location.reload(), 800); });
    });
  } else {
    userArea.innerHTML = `<a href="login.html" class="user-chip" style="padding:6px 16px"><span>دخول</span><div class="user-avatar">👤</div></a>`;
  }
}

async function loadProducts() {
  const grid = document.getElementById('productsGrid');
  try {
    const res = await api.products.getAll();
    allProducts = res.data || [];
    renderFilters();
    renderProducts();
  } catch (err) {
    grid.innerHTML = `<div class="empty-state"><p>حدث خطأ في تحميل المنتجات</p></div>`;
  }
}

function renderFilters() {
  const cats = ['الكل', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
  const wrap = document.getElementById('filtersWrap');
  wrap.innerHTML = cats.map(cat => {
    const count = cat === 'الكل' ? allProducts.length : allProducts.filter(p => p.category === cat).length;
    return `<button class="filter-btn ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">${cat} <span style="opacity:.6;font-size:12px;margin-right:4px">(${count})</span></button>`;
  }).join('');
  wrap.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => filterByCategory(btn.dataset.cat));
  });
}

window.filterByCategory = (cat) => {
  currentCategory = cat;
  renderFilters();
  renderProducts();
  document.getElementById('productsSection').scrollIntoView({ behavior: 'smooth' });
};

function renderProducts() {
  let filtered = allProducts;
  if (currentCategory !== 'الكل') filtered = filtered.filter(p => p.category === currentCategory);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p => p.name?.toLowerCase().includes(q) || p.brand?.toLowerCase().includes(q) || p.category?.toLowerCase().includes(q));
  }

  const grid = document.getElementById('productsGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><p>مفيش نتائج مطابقة</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((p, i) => {
    const img = p.thumbnail || (p.images && p.images[0]) || 'https://via.placeholder.com/400';
    const discount = p.oldPrice && p.oldPrice > p.price ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
    const rating = p.rating || 0;
    const fullStars = Math.round(rating);
    const stockClass = p.stock > 10 ? 'in' : p.stock > 0 ? 'low' : 'out';
    const stockText = p.stock > 10 ? 'متوفر' : p.stock > 0 ? `متبقي ${p.stock}` : 'نفذ';
    const isOut = p.stock <= 0;

    return `
      <div class="product-card">
        <a href="product.html?id=${p.id}" style="display:block">
          <div class="product-media">
            <img src="${img}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400/f4f2ed/c9a961?text=LUXE'">
            <div class="product-badges">
              ${discount > 0 ? `<span class="badge-pill badge-discount">-${discount}%</span>` : ''}
              ${p.isFeatured ? `<span class="badge-pill badge-featured">مميز</span>` : ''}
              ${isOut ? `<span class="badge-pill badge-out">نفذ</span>` : ''}
            </div>
          </div>
        </a>
        <div class="product-body">
          <span class="product-cat">${p.category || 'عام'}</span>
          <h3 class="product-title"><a href="product.html?id=${p.id}" style="color:inherit">${p.name}</a></h3>
          ${rating > 0 ? `<div class="product-rating"><span class="stars">${'★'.repeat(fullStars)}${'☆'.repeat(5 - fullStars)}</span><span class="rating-count">${rating.toFixed(1)}</span></div>` : ''}
          <div class="product-stock ${stockClass}">${stockText}</div>
          <div class="product-footer">
            <div>
              <div class="price-main">${p.price.toLocaleString('ar-EG')}<span class="currency">ج.م</span></div>
              ${p.oldPrice ? `<div class="price-old">${p.oldPrice.toLocaleString('ar-EG')} ج.م</div>` : ''}
            </div>
            <button class="add-btn" data-id="${p.id}" ${isOut ? 'disabled' : ''} aria-label="أضف للسلة">+</button>
          </div>
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.add-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const id = btn.dataset.id;
      const product = allProducts.find(p => p.id === id);
      if (!product) return;
      addToCart(product);
      showToast(`تمت الإضافة للسلة`, 'success');
      btn.style.background = '#10b981';
      btn.textContent = '✓';
      setTimeout(() => { btn.style.background = ''; btn.textContent = '+'; }, 1200);
    });
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderProducts();
});

renderUserArea();
updateCartBadge();
loadProducts();
</script>
</body>
</html>
