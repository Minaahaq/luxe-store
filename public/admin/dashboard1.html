<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <title>لوحة التحكم - LUXE Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  
  <!-- مكتبة الرسومات البيانية -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --gold: #c9a961; --gold-hover: #b89850;
      --bg-dark: #0f1115; --surface-dark: #171a21; --surface-hover: #1f232c;
      --border: #2a2f3a; --text: #e6e8ee; --muted: #8a90a2;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    }
    body, .admin-layout, .admin-main { background-color: var(--bg-dark) !important; color: var(--text) !important; }
    .admin-sidebar { background-color: var(--surface-dark) !important; border-left: 1px solid var(--border) !important; }

    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: var(--surface-dark); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 20px; position: relative; overflow: hidden; transition: transform 0.2s; }
    .kpi-card:hover { transform: translateY(-3px); border-color: rgba(201, 169, 97, 0.3); }
    .kpi-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; background: rgba(255,255,255,0.03); }
    .kpi-info h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .kpi-info .val { font-size: 28px; font-weight: 900; color: var(--text); }
    .kpi-info .val span { font-size: 14px; color: var(--muted); font-weight: 600; }

    /* Charts Grid */
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 30px; }
    @media (max-width: 992px) { .charts-grid { grid-template-columns: 1fr; } }
    
    .chart-card { background: var(--surface-dark); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .chart-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .chart-card h3::before { content: ''; display: block; width: 4px; height: 16px; background: var(--gold); border-radius: 4px; }

    /* Tables & Lists */
    .list-card { background: var(--surface-dark); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .list-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .list-card h3::before { content: ''; display: block; width: 4px; height: 16px; background: var(--gold); border-radius: 4px; }

    .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .recent-item:last-child { border-bottom: none; padding-bottom: 0; }
    .recent-item .info h4 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .recent-item .info p { font-size: 12px; color: var(--muted); }
    .recent-item .price { font-weight: 900; color: var(--gold); font-size: 16px; }

    .top-product { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .top-product:last-child { border-bottom: none; padding-bottom: 0; }
    .top-product img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
    .top-product .info { flex: 1; }
    .top-product .info h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .top-product .info p { font-size: 12px; color: var(--muted); }
    .top-product .sold { font-weight: 900; color: var(--gold); background: rgba(201, 169, 97, 0.1); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
  </style>
</head>
<body>

<div id="statusPage" class="admin-status-page">
  <div class="admin-status-box">
    <div class="emoji" id="statusEmoji" style="animation:spin 1s linear infinite;display:inline-block">⏳</div>
    <h1 id="statusTitle">جاري التحقق...</h1>
    <p id="statusMessage">من فضلك انتظر</p>
  </div>
</div>

<div class="admin-layout" id="adminLayout" style="display:none">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand"><div class="admin-brand-name">LUXE</div><div class="admin-brand-tag">Admin Panel</div></div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item active"><span class="icon">📊</span><span>لوحة التحكم</span></a>
      <a href="products.html" class="admin-nav-item"><span class="icon">📦</span><span>المنتجات</span></a>
      <a href="orders.html" class="admin-nav-item"><span class="icon">🛒</span><span>الطلبات</span></a>
      <a href="users.html" class="admin-nav-item"><span class="icon">👥</span><span>المستخدمين</span></a>
      <a href="coupons.html" class="admin-nav-item"><span class="icon">🎟️</span><span>أكواد الخصم</span></a>
      <a href="../index.html" class="admin-nav-item"><span class="icon">🏠</span><span>المتجر</span></a>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="admin-logout" id="logoutBtn"><span class="icon">🚪</span><span>تسجيل الخروج</span></button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn-admin" id="mobileMenuBtn">☰</button>
        <div>
          <h1 class="admin-page-title">نظرة عامة</h1>
          <p class="admin-page-subtitle">مرحباً بك في لوحة تحكم LUXE</p>
        </div>
      </div>
      <div class="admin-user-badge">
        <div class="avatar" id="adminInitial">A</div>
        <div class="info"><div class="name" id="adminName">Admin</div><div class="role">مدير</div></div>
      </div>
    </div>

    <!-- 1. KPIs -->
    <div class="kpi-grid" id="kpiGrid">
      <!-- سيتم ملؤها بالجافاسكريبت -->
    </div>

    <!-- 2. Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📈 إيرادات آخر 7 أيام</h3>
        <div style="height: 250px; position: relative;">
          <canvas id="salesChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>📊 الطلبات حسب الحالة</h3>
        <div style="height: 250px; position: relative; display:flex; justify-content:center;">
          <canvas id="statusChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 3. Recent & Top -->
    <div class="charts-grid" style="grid-template-columns: 1fr 1fr;">
      <div class="list-card">
        <h3>🛒 آخر الطلبات</h3>
        <div id="recentOrdersList"></div>
      </div>
      <div class="list-card">
        <h3>⭐ الأكثر مبيعاً</h3>
        <div id="topProductsList"></div>
      </div>
    </div>

  </main>
</div>

<script type="module">
import { api, getCurrentUser, logout } from '../js/api.js';

const $ = (id) => document.getElementById(id);
let salesChart = null;
let statusChart = null;

// Helpers
function showStatus(emoji, title, message, isLoading = false) {
  $('statusTitle').textContent = title; $('statusMessage').textContent = message;
  $('statusPage').style.display = 'flex'; $('adminLayout').style.display = 'none';
  const e = $('statusEmoji'); e.textContent = emoji; e.style.animation = isLoading ? 'spin 1s linear infinite' : 'none';
}
function showLayout() { $('statusPage').style.display = 'none'; $('adminLayout').style.display = 'grid'; }
function showToast(msg, type = 'info') {
  let c = $('toastContainer') || document.createElement('div');
  if (!c.id) { c.id = 'toastContainer'; c.className = 'toast-container'; document.body.appendChild(c); }
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = `<span style="font-weight:900">${type === 'success' ? '✓' : 'ℹ'}</span><span>${msg}</span>`;
  c.appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}

async function checkAdminAccess() {
  try {
    const user = await getCurrentUser();
    if (!user) { showStatus('🔒', 'غير مصرح', 'لازم تسجل دخول'); setTimeout(() => window.location.href = '../login.html', 1500); return null; }
    const meRes = await api.auth.me();
    if (!meRes.user || meRes.user.role !== 'admin') { showStatus('⛔', 'غير مصرح', 'للأدمن فقط'); setTimeout(() => window.location.href = '../index.html', 2500); return null; }
    const name = meRes.user.name || 'Admin';
    $('adminName').textContent = name; $('adminInitial').textContent = name.charAt(0).toUpperCase();
    return meRes.user;
  } catch (err) { showStatus('⚠️', 'خطأ', err.message); return null; }
}

// ===========================================
// Load Dashboard Data
// ===========================================
async function loadDashboard() {
  try {
    // 1. جلب الإحصائيات
    const [statsRes, ordersRes, productsRes] = await Promise.all([
      api.admin.getStats(),
      api.admin.getAllOrders(),
      api.products.getAll()
    ]);

    const stats = statsRes.data;
    const orders = ordersRes.data || [];
    const products = productsRes.data || [];

    renderKPIs(stats, orders);
    renderRecentOrders(orders);
    renderTopProducts(products);
    renderCharts(orders);

  } catch (err) {
    console.error(err);
    showToast('فشل تحميل بيانات لوحة التحكم', 'error');
  }
}

function renderKPIs(stats, orders) {
  const pendingOrders = orders.filter(o => o.status === 'pending_payment').length;
  
  $('kpiGrid').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-icon" style="color: var(--gold); background: rgba(201, 169, 97, 0.1);">💰</div>
      <div class="kpi-info">
        <h3>إجمالي الإيرادات</h3>
        <div class="val">${(stats.revenue || 0).toLocaleString('ar-EG')} <span>ج.م</span></div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="color: #3b82f6; background: rgba(59, 130, 246, 0.1);">🛒</div>
      <div class="kpi-info">
        <h3>إجمالي الطلبات</h3>
        <div class="val">${orders.length} <span>طلب</span></div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="color: var(--warning); background: rgba(245, 158, 11, 0.1);">⏳</div>
      <div class="kpi-info">
        <h3>طلبات معلقة</h3>
        <div class="val">${pendingOrders} <span>في انتظار الدفع</span></div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="color: var(--success); background: rgba(16, 185, 129, 0.1);">👥</div>
      <div class="kpi-info">
        <h3>العملاء</h3>
        <div class="val">${stats.users} <span>مستخدم مسجل</span></div>
      </div>
    </div>
  `;
}

function renderRecentOrders(orders) {
  const recent = orders.slice(0, 4);
  if (recent.length === 0) {
    $('recentOrdersList').innerHTML = '<p style="color:var(--muted);text-align:center">لا يوجد طلبات بعد</p>';
    return;
  }

  $('recentOrdersList').innerHTML = recent.map(o => `
    <div class="recent-item">
      <div class="info">
        <h4>${o.customer?.name || 'عميل'} <span style="font-size:11px;color:var(--muted);font-weight:normal">#${o.orderNumber}</span></h4>
        <p>${new Date(o.createdAt).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })}</p>
      </div>
      <div class="price">${(o.total || 0).toLocaleString('ar-EG')} ج.م</div>
    </div>
  `).join('');
}

function renderTopProducts(products) {
  const top = products.sort((a, b) => (b.sold || 0) - (a.sold || 0)).slice(0, 4);
  if (top.length === 0) {
    $('topProductsList').innerHTML = '<p style="color:var(--muted);text-align:center">لا يوجد منتجات</p>';
    return;
  }
  
  $('topProductsList').innerHTML = top.map(p => `
    <div class="top-product">
      <img src="${p.thumbnail || 'https://via.placeholder.com/50'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/50/f4f2ed/c9a961?text=LX'">
      <div class="info">
        <h4>${p.name}</h4>
        <p>${(p.price || 0).toLocaleString('ar-EG')} ج.م</p>
      </div>
      <div class="sold">${p.sold || 0} مبيعة</div>
    </div>
  `).join('');
}

function renderCharts(orders) {
  // 1. Sales Chart (Line)
  const ctxSales = document.getElementById('salesChart').getContext('2d');
  const labels = [];
  const data = [];

  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    labels.push(d.toLocaleDateString('ar-EG', { weekday: 'short' }));
    const dayTotal = orders
      .filter(o => o.createdAt.startsWith(dateStr) && o.status !== 'cancelled')
      .reduce((sum, o) => sum + (o.total || 0), 0);
    data.push(dayTotal);
  }

  if (salesChart) salesChart.destroy();
  salesChart = new Chart(ctxSales, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'الإيرادات',
        data,
        borderColor: '#c9a961',
        backgroundColor: 'rgba(201, 169, 97, 0.1)',
        borderWidth: 3,
        tension: 0.4,
        fill: true,
        pointBackgroundColor: '#0f1115',
        pointBorderColor: '#c9a961',
        pointBorderWidth: 2,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8a90a2' } },
        x: { grid: { display: false }, ticks: { color: '#8a90a2' } }
      }
    }
  });

  // 2. Status Chart (Doughnut)
  const ctxStatus = document.getElementById('statusChart').getContext('2d');
  const statusCounts = {
    pending_payment: orders.filter(o => o.status === 'pending_payment').length,
    processing: orders.filter(o => o.status === 'processing').length,
    shipped: orders.filter(o => o.status === 'shipped').length,
    delivered: orders.filter(o => o.status === 'delivered').length,
    cancelled: orders.filter(o => o.status === 'cancelled').length
  };

  if (statusChart) statusChart.destroy();
  statusChart = new Chart(ctxStatus, {
    type: 'doughnut',
    data: {
      labels: ['انتظار الدفع', 'قيد التجهيز', 'تم الشحن', 'تم التوصيل', 'ملغي'],
      datasets: [{
        data: Object.values(statusCounts),
        backgroundColor: ['#f59e0b', '#8b5cf6', '#3b82f6', '#10b981', '#ef4444'],
        borderWidth: 0,
        hoverOffset: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '70%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#8a90a2', padding: 20, font: { family: 'Cairo' } } }
      }
    }
  });
}

// Events
$('logoutBtn').addEventListener('click', async () => {
  if (!confirm('تسجيل الخروج؟')) return;
  await logout(); window.location.href = '../login.html';
});
$('mobileMenuBtn')?.addEventListener('click', () => {
  $('adminSidebar').classList.add('open'); $('sidebarOverlay').classList.add('active');
});
$('sidebarOverlay')?.addEventListener('click', () => {
  $('adminSidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('active');
});

// Init
async function init() {
  showStatus('⏳', 'جاري التحقق...', 'بنشوف صلاحياتك', true);
  const adminUser = await checkAdminAccess();
  if (!adminUser) return;
  showLayout();
  await loadDashboard();
}
init();
</script>
</body>
</html>
