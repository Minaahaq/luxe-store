<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات - LUXE Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Status page -->
<div id="statusPage" class="admin-status-page">
  <div class="admin-status-box">
    <div class="emoji" id="statusEmoji" style="animation:spin 1s linear infinite;display:inline-block">⏳</div>
    <h1 id="statusTitle">جاري التحقق...</h1>
    <p id="statusMessage">من فضلك انتظر</p>
  </div>
</div>

<div class="admin-layout" id="adminLayout" style="display:none">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <div class="admin-brand-name">LUXE</div>
      <div class="admin-brand-tag">Admin Panel</div>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item"><span class="icon">📊</span><span>لوحة التحكم</span></a>
      <a href="products.html" class="admin-nav-item active"><span class="icon">📦</span><span>المنتجات</span></a>
      <a href="orders.html" class="admin-nav-item"><span class="icon">🛒</span><span>الطلبات</span></a>
      <a href="users.html" class="admin-nav-item"><span class="icon">👥</span><span>المستخدمين</span></a>
      <a href="../index.html" class="admin-nav-item"><span class="icon">🏠</span><span>المتجر</span></a>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="admin-logout" id="logoutBtn"><span class="icon">🚪</span><span>تسجيل الخروج</span></button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn-admin" id="mobileMenuBtn">☰</button>
        <div>
          <h1 class="admin-page-title">إدارة المنتجات</h1>
          <p class="admin-page-subtitle" id="productsCount">جاري التحميل...</p>
        </div>
      </div>
      <div class="admin-user-badge">
        <div class="avatar" id="adminInitial">A</div>
        <div class="info">
          <div class="name" id="adminName">Admin</div>
          <div class="role">مدير</div>
        </div>
      </div>
    </div>

    <!-- Mini stats -->
    <div class="mini-stats-row" id="miniStats">
      <div class="mini-stat-box"><div class="num" id="statTotal">-</div><div class="lbl">إجمالي المنتجات</div></div>
      <div class="mini-stat-box"><div class="num" id="statInStock">-</div><div class="lbl">متوفرة</div></div>
      <div class="mini-stat-box"><div class="num" id="statLowStock">-</div><div class="lbl">مخزون منخفض</div></div>
      <div class="mini-stat-box"><div class="num" id="statOutStock">-</div><div class="lbl">نفذت</div></div>
    </div>

    <!-- Toolbar -->
    <div class="admin-toolbar">
      <input type="text" class="search-admin-input" id="searchInput" placeholder="🔍 ابحث بالاسم، SKU، أو الماركة...">
      <select class="filter-select-admin" id="categoryFilter">
        <option value="">كل الفئات</option>
      </select>
      <select class="filter-select-admin" id="stockFilter">
        <option value="">كل الحالات</option>
        <option value="in">متوفر</option>
        <option value="low">مخزون منخفض</option>
        <option value="out">نفذت الكمية</option>
      </select>
      <button class="btn-add-product" id="addProductBtn">➕ إضافة منتج</button>
    </div>

    <!-- Table -->
    <div class="admin-table-wrap">
      <div id="tableContainer">
        <div style="padding:40px;text-align:center">
          <div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:10px"></div>
          <div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:10px"></div>
          <div class="skeleton" style="height:60px;border-radius:12px"></div>
        </div>
      </div>
      <div class="pagination-wrap" id="pagination" style="display:none">
        <span id="pageInfo">-</span>
        <div class="pagination-buttons" id="pageButtons"></div>
      </div>
    </div>

  </main>
</div>

<!-- Modal -->
<div class="admin-modal-overlay" id="productModal">
  <div class="admin-modal">
    <div class="admin-modal-header">
      <h2 id="modalTitle">إضافة منتج جديد</h2>
      <button class="admin-modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="admin-modal-body">
      <form id="productForm">
        <input type="hidden" id="productId">

        <div class="admin-form-group">
          <label>اسم المنتج <span class="req">*</span></label>
          <input type="text" id="p-name" placeholder="مثال: سماعات Sony WH-1000XM5" required>
        </div>

        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>الفئة <span class="req">*</span></label>
            <select id="p-category" required>
              <option value="">اختر الفئة</option>
              <option>إلكترونيات</option>
              <option>أزياء</option>
              <option>عطور</option>
              <option>أحذية</option>
              <option>حقائب</option>
              <option>ساعات</option>
            </select>
          </div>
          <div class="admin-form-group">
            <label>الماركة</label>
            <input type="text" id="p-brand" placeholder="مثال: Sony">
          </div>
        </div>

        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>السعر (ج.م) <span class="req">*</span></label>
            <input type="number" id="p-price" placeholder="12999" min="1" step="0.01" required>
          </div>
          <div class="admin-form-group">
            <label>السعر قبل الخصم</label>
            <input type="number" id="p-oldPrice" placeholder="14999" min="0" step="0.01">
          </div>
        </div>

        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>الكمية في المخزون <span class="req">*</span></label>
            <input type="number" id="p-stock" placeholder="25" min="0" required>
          </div>
          <div class="admin-form-group">
            <label>SKU (اختياري)</label>
            <input type="text" id="p-sku" placeholder="LX-001">
          </div>
        </div>

        <div class="admin-form-group">
          <label>رابط الصورة الرئيسية</label>
          <input type="url" id="p-thumbnail" placeholder="https://example.com/image.jpg">
        </div>

        <div class="admin-form-group">
          <label>الوصف</label>
          <textarea id="p-description" placeholder="وصف تفصيلي للمنتج..."></textarea>
        </div>

        <div class="admin-form-row">
          <label class="admin-form-checkbox">
            <input type="checkbox" id="p-featured">
            <span>⭐ منتج مميز</span>
          </label>
          <label class="admin-form-checkbox">
            <input type="checkbox" id="p-active" checked>
            <span>✓ معروض في المتجر</span>
          </label>
        </div>
      </form>
    </div>
    <div class="admin-modal-footer">
      <button class="btn-modal" id="modalCancelBtn">إلغاء</button>
      <button class="btn-modal primary" id="modalSaveBtn">💾 حفظ المنتج</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="admin-modal-overlay" id="deleteModal">
  <div class="admin-modal" style="max-width:420px">
    <div class="admin-modal-header">
      <h2>⚠️ تأكيد الحذف</h2>
      <button class="admin-modal-close" id="deleteCloseBtn">✕</button>
    </div>
    <div class="admin-modal-body">
      <p style="font-size:14px;line-height:1.7;color:var(--text-muted)">
        هتحذف المنتج <strong id="deleteProductName" style="color:var(--ink)">-</strong> نهائياً. العملية مش ممكن التراجع عنها.
      </p>
    </div>
    <div class="admin-modal-footer">
      <button class="btn-modal" id="deleteCancelBtn">إلغاء</button>
      <button class="btn-modal danger" id="deleteConfirmBtn">🗑 حذف نهائي</button>
    </div>
  </div>
</div>

<script type="module">
import { api, getCurrentUser, logout } from '../js/api.js';

let allProducts = [];
let filteredProducts = [];
let currentPage = 1;
const perPage = 8;
let deleteTargetId = null;

// ===========================================
// Status
// ===========================================
function showStatus(emoji, title, message, isLoading = false) {
  const e = document.getElementById('statusEmoji');
  e.textContent = emoji;
  e.style.animation = isLoading ? 'spin 1s linear infinite' : 'none';
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusMessage').textContent = message;
  document.getElementById('statusPage').style.display = 'flex';
  document.getElementById('adminLayout').style.display = 'none';
}

function showLayout() {
  document.getElementById('statusPage').style.display = 'none';
  document.getElementById('adminLayout').style.display = 'grid';
}

function showToast(message, type = 'info') {
  let c = document.getElementById('toastContainer');
  if (!c) {
    c = document.createElement('div');
    c.id = 'toastContainer';
    c.className = 'toast-container';
    document.body.appendChild(c);
  }
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span style="font-weight:900">${icons[type]}</span><span>${message}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(-20px)'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

// ===========================================
// Access check
// ===========================================
async function checkAdminAccess() {
  try {
    const user = await getCurrentUser();
    if (!user) {
      showStatus('🔒', 'غير مصرح', 'لازم تسجل دخول');
      setTimeout(() => window.location.href = '../login.html?redirect=admin/products.html', 1500);
      return null;
    }
    const meRes = await api.auth.me();
    const userData = meRes.user;
    if (!userData || userData.role !== 'admin') {
      showStatus('⛔', 'غير مصرح', 'الصفحة دي للأدمن فقط');
      setTimeout(() => window.location.href = '../index.html', 2500);
      return null;
    }
    const name = userData.name || user.displayName || 'Admin';
    document.getElementById('adminName').textContent = name;
    document.getElementById('adminInitial').textContent = name.charAt(0).toUpperCase();
    return userData;
  } catch (err) {
    console.error(err);
    showStatus('⚠️', 'خطأ', err.message);
    return null;
  }
}

// ===========================================
// Load Products
// ===========================================
async function loadProducts() {
  try {
    const res = await api.products.getAll();
    allProducts = res.data || [];
    buildCategoryFilter();
    applyFilters();
    updateStats();
  } catch (err) {
    console.error(err);
    document.getElementById('tableContainer').innerHTML = `
      <div style="padding:60px 20px;text-align:center">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">خطأ في التحميل</h3>
        <p style="color:var(--text-muted);font-size:13px">${err.message}</p>
      </div>`;
  }
}

function updateStats() {
  const total = allProducts.length;
  const inStock = allProducts.filter(p => p.stock > 10).length;
  const lowStock = allProducts.filter(p => p.stock > 0 && p.stock <= 10).length;
  const outStock = allProducts.filter(p => p.stock <= 0).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statInStock').textContent = inStock;
  document.getElementById('statLowStock').textContent = lowStock;
  document.getElementById('statOutStock').textContent = outStock;
  document.getElementById('productsCount').textContent = `${total} منتج في المتجر`;
}

function buildCategoryFilter() {
  const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
  const sel = document.getElementById('categoryFilter');
  sel.innerHTML = `<option value="">كل الفئات</option>` + cats.map(c => `<option>${c}</option>`).join('');
}

// ===========================================
// Filters
// ===========================================
function applyFilters() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  const stock = document.getElementById('stockFilter').value;

  filteredProducts = allProducts.filter(p => {
    if (search) {
      const match = p.name?.toLowerCase().includes(search) ||
                    p.sku?.toLowerCase().includes(search) ||
                    p.brand?.toLowerCase().includes(search);
      if (!match) return false;
    }
    if (category && p.category !== category) return false;
    if (stock === 'in' && p.stock <= 10) return false;
    if (stock === 'low' && (p.stock <= 0 || p.stock > 10)) return false;
    if (stock === 'out' && p.stock > 0) return false;
    return true;
  });

  currentPage = 1;
  renderTable();
}

// ===========================================
// Render Table
// ===========================================
function renderTable() {
  const container = document.getElementById('tableContainer');
  const total = filteredProducts.length;

  if (total === 0) {
    container.innerHTML = `
      <div style="padding:60px 20px;text-align:center">
        <div style="font-size:48px;margin-bottom:12px">📦</div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">لا يوجد منتجات</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px">ابدأ بإضافة منتجات للمتجر</p>
        <button class="btn-add-product" onclick="document.getElementById('addProductBtn').click()">➕ إضافة أول منتج</button>
      </div>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const totalPages = Math.ceil(total / perPage);
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * perPage;
  const pageItems = filteredProducts.slice(start, start + perPage);

  container.innerHTML = `
    <table class="admin-table">
      <thead>
        <tr>
          <th>المنتج</th>
          <th>الفئة</th>
          <th>السعر</th>
          <th>المخزون</th>
          <th>الحالة</th>
          <th style="text-align:left">إجراءات</th>
        </tr>
      </thead>
      <tbody>
        ${pageItems.map(p => {
          const img = p.thumbnail || (p.images && p.images[0]) || 'https://via.placeholder.com/48';
          const stockCls = p.stock > 10 ? 'in' : p.stock > 0 ? 'low' : 'out';
          const stockText = p.stock > 10 ? `${p.stock} متوفر` : p.stock > 0 ? `${p.stock} متبقي` : 'نفذت';
          return `
            <tr>
              <td>
                <div class="product-cell">
                  <img src="${img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/48/f4f2ed/c9a961?text=LX'">
                  <div class="info">
                    <div class="name">${p.name}</div>
                    <div class="sku">${p.sku || '—'}</div>
                  </div>
                </div>
              </td>
              <td><span class="category-tag">${p.category || '—'}</span></td>
              <td class="price-cell">${(p.price || 0).toLocaleString('ar-EG')} <span class="currency">ج.م</span></td>
              <td><span class="stock-cell ${stockCls}">${stockText}</span></td>
              <td>
                <span class="status-badge-admin ${p.isActive !== false ? 'active' : 'inactive'}">
                  ${p.isActive !== false ? '✓ معروض' : '✕ مخفي'}
                </span>
              </td>
              <td>
                <div class="actions-cell">
                  <button class="icon-action-btn" data-edit="${p.id}" title="تعديل">✏️</button>
                  <button class="icon-action-btn danger" data-delete="${p.id}" title="حذف">🗑</button>
                </div>
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  // Pagination
  if (totalPages > 1) {
    document.getElementById('pagination').style.display = 'flex';
    document.getElementById('pageInfo').textContent = `عرض ${start + 1}-${Math.min(start + perPage, total)} من ${total}`;
    const btns = document.getElementById('pageButtons');
    let html = '';
    html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">›</button>`;
    btns.innerHTML = html;
    btns.querySelectorAll('.page-btn').forEach(b => {
      b.addEventListener('click', () => {
        if (b.disabled) return;
        currentPage = parseInt(b.dataset.page);
        renderTable();
      });
    });
  } else {
    document.getElementById('pagination').style.display = 'none';
  }

  // Attach actions
  container.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', () => openEditModal(b.dataset.edit));
  });
  container.querySelectorAll('[data-delete]').forEach(b => {
    b.addEventListener('click', () => openDeleteModal(b.dataset.delete));
  });
}

// ===========================================
// Add/Edit Modal
// ===========================================
function openAddModal() {
  document.getElementById('modalTitle').textContent = 'إضافة منتج جديد';
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('p-active').checked = true;
  document.getElementById('productModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function openEditModal(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modalTitle').textContent = 'تعديل المنتج';
  document.getElementById('productId').value = p.id;
  document.getElementById('p-name').value = p.name || '';
  document.getElementById('p-category').value = p.category || '';
  document.getElementById('p-brand').value = p.brand || '';
  document.getElementById('p-price').value = p.price || '';
  document.getElementById('p-oldPrice').value = p.oldPrice || '';
  document.getElementById('p-stock').value = p.stock || 0;
  document.getElementById('p-sku').value = p.sku || '';
  document.getElementById('p-thumbnail').value = p.thumbnail || '';
  document.getElementById('p-description').value = p.description || '';
  document.getElementById('p-featured').checked = !!p.isFeatured;
  document.getElementById('p-active').checked = p.isActive !== false;

  document.getElementById('productModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeProductModal() {
  document.getElementById('productModal').classList.remove('active');
  document.body.style.overflow = '';
}

async function saveProduct() {
  const id = document.getElementById('productId').value;
  const btn = document.getElementById('modalSaveBtn');

  const data = {
    name: document.getElementById('p-name').value.trim(),
    category: document.getElementById('p-category').value,
    brand: document.getElementById('p-brand').value.trim(),
    price: parseFloat(document.getElementById('p-price').value),
    oldPrice: parseFloat(document.getElementById('p-oldPrice').value) || null,
    stock: parseInt(document.getElementById('p-stock').value) || 0,
    sku: document.getElementById('p-sku').value.trim(),
    thumbnail: document.getElementById('p-thumbnail').value.trim(),
    description: document.getElementById('p-description').value.trim(),
    isFeatured: document.getElementById('p-featured').checked,
    isActive: document.getElementById('p-active').checked
  };

  if (!data.name || !data.category || !data.price || data.stock < 0) {
    showToast('أكمل البيانات المطلوبة', 'error');
    return;
  }

  data.images = data.thumbnail ? [data.thumbnail] : [];

  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';

  try {
    if (id) {
      await api.admin.updateProduct(id, data);
      showToast('تم تحديث المنتج ✓', 'success');
    } else {
      await api.admin.addProduct(data);
      showToast('تم إضافة المنتج ✓', 'success');
    }
    closeProductModal();
    await loadProducts();
  } catch (err) {
    showToast(err.message || 'فشل الحفظ', 'error');
    btn.disabled = false;
    btn.textContent = '💾 حفظ المنتج';
  }
}

// ===========================================
// Delete
// ===========================================
function openDeleteModal(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  deleteTargetId = id;
  document.getElementById('deleteProductName').textContent = p.name;
  document.getElementById('deleteModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDeleteModal() {
  deleteTargetId = null;
  document.getElementById('deleteModal').classList.remove('active');
  document.body.style.overflow = '';
}

async function confirmDelete() {
  if (!deleteTargetId) return;
  const btn = document.getElementById('deleteConfirmBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الحذف...';

  try {
    await api.admin.deleteProduct(deleteTargetId);
    showToast('تم حذف المنتج', 'success');
    closeDeleteModal();
    await loadProducts();
  } catch (err) {
    showToast(err.message || 'فشل الحذف', 'error');
    btn.disabled = false;
    btn.textContent = '🗑 حذف نهائي';
  }
}

// ===========================================
// Events
// ===========================================
document.getElementById('addProductBtn').addEventListener('click', openAddModal);
document.getElementById('modalCloseBtn').addEventListener('click', closeProductModal);
document.getElementById('modalCancelBtn').addEventListener('click', closeProductModal);
document.getElementById('modalSaveBtn').addEventListener('click', saveProduct);
document.getElementById('deleteCloseBtn').addEventListener('click', closeDeleteModal);
document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal);
document.getElementById('deleteConfirmBtn').addEventListener('click', confirmDelete);

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('categoryFilter').addEventListener('change', applyFilters);
document.getElementById('stockFilter').addEventListener('change', applyFilters);

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (!confirm('تسجيل الخروج؟')) return;
  await logout();
  window.location.href = '../login.html';
});

// Mobile menu
document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
  document.getElementById('adminSidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('active');
});
document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
  document.getElementById('adminSidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
});

// Close modals on overlay click
document.getElementById('productModal').addEventListener('click', (e) => {
  if (e.target.id === 'productModal') closeProductModal();
});
document.getElementById('deleteModal').addEventListener('click', (e) => {
  if (e.target.id === 'deleteModal') closeDeleteModal();
});

// ===========================================
// Init
// ===========================================
async function init() {
  showStatus('⏳', 'جاري التحقق...', 'بنشوف صلاحياتك', true);
