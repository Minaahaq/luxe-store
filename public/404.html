<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة - LUXE Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0a0e17 0%, #1c2233 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      text-align: center;
    }
    .container { max-width: 500px; }
    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #c9a961;
      margin-bottom: 32px;
    }
    .code {
      font-family: 'Tajawal', sans-serif;
      font-size: 140px;
      font-weight: 900;
      background: linear-gradient(135deg, #c9a961, #e8d5a3);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Tajawal', sans-serif;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    p {
      color: #a0a5b5;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #c9a961, #a8894a);
      color: #0a0e17;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: .3s;
      box-shadow: 0 8px 30px rgba(201, 169, 97, .35);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(201, 169, 97, .5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">LUXE</div>
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>عذراً، الصفحة اللي بتدور عليها مش موجودة أو اتنقلت لمكان تاني.</p>
    <a href="/index.html" class="btn">🏠 العودة للرئيسية</a>
  </div>
</body>
</html>
